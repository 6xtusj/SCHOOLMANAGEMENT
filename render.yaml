services:
  - type: web
    name: school-management-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: UPLOAD_STORAGE
        value: database
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MIN
        value: 1
      - key: DB_POOL_MAX
        value: 4
      - key: DB_POOL_TIMEOUT
        value: 10
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
